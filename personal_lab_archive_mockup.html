<script>
const g = document.getElementById('grass');
for(let w=0; w<48; w++){
  const col = document.createElement('div');
  col.style.cssText = 'display:flex; flex-direction:column; gap:3px;';
  for(let d=0; d<7; d++){
    const cell = document.createElement('div');
    const active = (d>=5 && Math.random()<0.75) || Math.random()<0.08;
    const level = active ? Math.ceil(Math.random()*3) : 0;
    const colors = ['var(--surface-1)','#9FE1CB','#5DCAA5','#1D9E75'];
    cell.style.cssText = 'aspect-ratio:1; border-radius:2px; background:'+colors[level]+';';
    col.appendChild(cell);
  }
  g.appendChild(col);
}
</script>
