<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#292c28">
  <meta name="description" content="날씨와 스타일을 골라 머무는 작은 창가. 화창, 비, 눈, 안개, 뇌우와 캐주얼·사실적 스타일의 움직이는 디오라마.">
  <title>창가의 날씨 · A Little Window</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (() => { let fromLab = new URLSearchParams(location.search).get('from') === 'lab'; try { fromLab ||= !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (_) {} if (fromLab) document.documentElement.classList.add('from-lab'); })();
  </script>
  <script src="../../shared/lab-config.js" defer></script>
  <script src="../../shared/lab-sync-core.js" defer></script>
  <script src="../../shared/lab-drive-sync.js" defer></script>
  <script src="photographic.js" defer></script>
  <script src="scene.js" defer></script>
</head>
<body>
  <main id="diorama">
    <canvas id="scene" role="img" aria-label="따뜻한 방의 창문 너머로 비가 내리는 호숫가 풍경"></canvas>
    <div id="photo-status" class="photo-status" role="status" hidden></div>
    <div class="shade" aria-hidden="true"></div>
    <header class="chrome header">
      <div class="brand"><a href="../../" class="back lab-back" aria-label="실험실로 돌아가기">↗</a><div><span class="eyebrow">A LITTLE WINDOW &nbsp; / &nbsp; 011</span><h1>창가의 날씨</h1></div></div>
      <div class="tools">
        <button id="pause" class="tool" aria-label="움직임 멈추기" aria-pressed="false" title="움직임 멈추기"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
        <button id="fullscreen" class="tool" aria-label="전체 화면" title="전체 화면"><svg viewBox="0 0 24 24"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></svg></button>
      </div>
    </header>
    <section class="chrome mood" aria-label="현재 풍경">
      <div class="scene-index"><span class="live-dot"></span><span id="scene-number">SCENE 02 / 05</span><span id="motion-status" class="sr-only"></span></div>
      <h2 id="mood-title">비가 머무는 오후</h2>
      <p id="mood-copy">창밖은 조금 흐려도, 이 안은 따뜻하니까.</p>
      <div class="conditions"><span id="weather-label">RAINY</span><span class="divider"></span><span id="time-label">16:00 · 오후</span></div>
    </section>
    <section class="chrome controls" aria-label="풍경 설정">
      <div class="panel-head"><span class="eyebrow">MAKE YOUR LITTLE MOMENT</span><span class="small-star" aria-hidden="true">✳</span></div>
      <fieldset class="weather-field"><legend>창밖의 날씨</legend><div class="weather-options">
        <button data-weather="sunny" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>화창</span></button>
        <button data-weather="rain" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M6 14a4 4 0 0 1 0-8 6 6 0 0 1 11.5 2A3 3 0 0 1 18 14H6m1 3-1 3m6-3-1 3m6-3-1 3"/></svg><span>비</span></button>
        <button data-weather="snow" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7M9 4l3 3 3-3M9 20l3-3 3 3M4 10l1-4 4-1m6 14 4-1 1-4M4 14l1 4 4 1M15 5l4 1 1 4"/></svg><span>눈</span></button>
        <button data-weather="fog" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M2 12h14m3 0h3M5 17h15"/></svg><span>안개</span></button>
        <button data-weather="storm" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 13a4 4 0 0 1 1-8 6 6 0 0 1 11.5 2A3 3 0 0 1 18 13h-2M12 11l-4 6h5l-3 5"/></svg><span>뇌우</span></button>
      </div></fieldset>
      <div class="panel-divider"></div>
      <fieldset class="style-field"><legend>풍경의 스타일</legend><div class="style-options"><button data-style="casual" aria-pressed="true"><span>캐주얼</span><small>포근한 일러스트</small></button><button data-style="realistic" aria-pressed="false"><span>사실적</span><small>사진 같은 창가</small></button></div></fieldset>
      <div class="time-head"><label for="hour">하루의 빛</label><output id="hour-output" for="hour">16:00</output></div>
      <input id="hour" type="range" min="0" max="23.75" step="0.25" value="16" aria-label="하루의 시간">
      <div class="time-ticks" aria-hidden="true"><span>한밤</span><span>아침</span><span>한낮</span><span>저녁</span><span>밤</span></div>
      <div class="panel-bottom"><button id="sound" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m11 5-6 4H2v6h3l6 4V5m5 4 5 6m0-6-5 6"/></svg><span>소리 켜기</span></button><label class="volume"><span class="sr-only">환경음 크기</span><input id="volume" type="range" min="0" max="100" value="35" aria-label="환경음 크기"></label></div>
    </section>
    <footer class="chrome footer"><span>아무것도 하지 않아도 괜찮은 시간.</span><span id="scene-note" class="note">상상 속 날씨 · 소리는 켤 때만 재생돼요</span></footer>
    <button id="hide-ui" class="view-toggle" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><span>풍경만 보기</span><kbd>H</kbd></button>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
    <noscript><div class="no-script">창가를 움직이려면 JavaScript를 켜주세요.</div></noscript>
  </main>
</body>
</html>
