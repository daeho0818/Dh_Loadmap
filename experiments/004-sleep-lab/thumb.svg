<svg viewBox="0 0 200 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sleep Lab">
  <rect width="200" height="90" fill="#0c1626"/>
  <!-- actogram rows -->
  <g>
    <rect x="30" y="16" width="140" height="7" rx="2" fill="#1c2740"/>
    <rect x="74" y="16" width="52" height="7" rx="2" fill="#9fe1cb"/>
    <rect x="30" y="28" width="140" height="7" rx="2" fill="#1c2740"/>
    <rect x="86" y="28" width="46" height="7" rx="2" fill="#85b7eb"/>
    <rect x="30" y="40" width="140" height="7" rx="2" fill="#1c2740"/>
    <rect x="98" y="40" width="40" height="7" rx="2" fill="#f0997b"/>
    <rect x="30" y="52" width="140" height="7" rx="2" fill="#1c2740"/>
    <rect x="70" y="52" width="56" height="7" rx="2" fill="#9fe1cb"/>
  </g>
  <!-- bedtime cutoff line -->
  <line x1="92" y1="12" x2="92" y2="63" stroke="#fac775" stroke-width="1" stroke-dasharray="3 3" opacity="0.8"/>
  <!-- moon -->
  <circle cx="166" cy="70" r="9" fill="#85b7eb"/>
  <circle cx="170" cy="67" r="9" fill="#0c1626"/>
  <text x="100" y="82" text-anchor="middle" font-family="monospace" font-size="8" fill="#85b7eb">what breaks your sleep?</text>
</svg>
