<svg viewBox="0 0 200 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Daily Loop">
  <defs>
    <linearGradient id="dl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16232a"/>
      <stop offset="1" stop-color="#0d1418"/>
    </linearGradient>
  </defs>
  <rect width="200" height="90" fill="url(#dl-bg)"/>

  <!-- 한 주 = 고리 일곱 개, 왼쪽부터 월~일 -->
  <g fill="none" stroke-width="4.2" stroke-linecap="round">
    <!-- 월 100% -->
    <circle cx="26" cy="38" r="11" stroke="#24333b"/>
    <circle cx="26" cy="38" r="11" stroke="#5ee0ba" stroke-dasharray="69.1" stroke-dashoffset="0" transform="rotate(-90 26 38)"/>
    <!-- 화 80% -->
    <circle cx="52" cy="38" r="11" stroke="#24333b"/>
    <circle cx="52" cy="38" r="11" stroke="#3ba888" stroke-dasharray="69.1" stroke-dashoffset="13.8" transform="rotate(-90 52 38)"/>
    <!-- 수 100% -->
    <circle cx="78" cy="38" r="11" stroke="#24333b"/>
    <circle cx="78" cy="38" r="11" stroke="#5ee0ba" stroke-dasharray="69.1" stroke-dashoffset="0" transform="rotate(-90 78 38)"/>
    <!-- 목 45% -->
    <circle cx="104" cy="38" r="11" stroke="#24333b"/>
    <circle cx="104" cy="38" r="11" stroke="#2a7a63" stroke-dasharray="69.1" stroke-dashoffset="38" transform="rotate(-90 104 38)"/>
    <!-- 금 (오늘) 채워지는 중 -->
    <circle cx="130" cy="38" r="11" stroke="#24333b"/>
    <circle cx="130" cy="38" r="11" stroke="#5ee0ba" stroke-dasharray="69.1" transform="rotate(-90 130 38)">
      <animate attributeName="stroke-dashoffset" from="69.1" to="17.3" dur="1.1s" fill="freeze"/>
    </circle>
    <!-- 토 20% -->
    <circle cx="156" cy="38" r="11" stroke="#24333b"/>
    <circle cx="156" cy="38" r="11" stroke="#4c5a63" stroke-dasharray="69.1" stroke-dashoffset="55.3" transform="rotate(-90 156 38)"/>
    <!-- 일 (아직) -->
    <circle cx="180" cy="38" r="11" stroke="#24333b" stroke-dasharray="2 4"/>
  </g>

  <g font-family="monospace" font-size="7" fill="#7a8e97" text-anchor="middle">
    <text x="26" y="60">월</text>
    <text x="52" y="60">화</text>
    <text x="78" y="60">수</text>
    <text x="104" y="60">목</text>
    <text x="130" y="60" fill="#5ee0ba">금</text>
    <text x="156" y="60" fill="#7fb2e8">토</text>
    <text x="180" y="60" fill="#e8899a">일</text>
  </g>

  <text x="100" y="80" text-anchor="middle" font-family="monospace" font-size="7.6" fill="#4fd1ad">close the loop, one day at a time</text>
</svg>
